(()=>{const root=document.querySelector('#welcome'),bar=document.querySelector('#bar'),pct=document.querySelector('#percentage'),track=document.querySelector('.track'),status=document.querySelector('#status'),button=document.querySelector('#enter');let progress=0,frame;function setProgress(value){progress=Math.max(0,Math.min(100,Number(value)||0));bar.style.width=progress+'%';pct.textContent=Math.floor(progress)+'%';track.setAttribute('aria-valuenow',Math.floor(progress));status.textContent=progress>=100?'Your workspace is ready':progress>65?'Bringing everything together':progress>30?'Preparing your pricing engines':'Preparing your workspace';button.classList.toggle('ready',progress>=100)}function enter(){root.classList.add('exiting');setTimeout(()=>{window.dispatchEvent(new CustomEvent('marginforge:enter'));if(window.parent!==window)window.parent.postMessage({type:'marginforge:enter'},location.origin);root.hidden=true},650)}window.MarginForgeWelcome={setProgress(value){cancelAnimationFrame(frame);setProgress(value)},complete(){cancelAnimationFrame(frame);setProgress(100)},enter,replay(){root.hidden=false;root.classList.remove('exiting');demo()}};button.addEventListener('click',enter);function demo(){const start=performance.now();function tick(now){let t=Math.min(1,(now-start)/2500);setProgress(100*(1-Math.pow(1-t,1.7)));if(t<1)frame=requestAnimationFrame(tick);else{setProgress(100);window.dispatchEvent(new CustomEvent('marginforge:enter'));if(window.parent!==window)window.parent.postMessage({type:'marginforge:enter'},location.origin);}}frame=requestAnimationFrame(tick)}if(!new URLSearchParams(location.search).has('manual'))demo()})();
